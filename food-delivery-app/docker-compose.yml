services:
  db:
    image: postgres:18.3-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: fd_user
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fd_user -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10


  flyway:
    image: flyway/flyway:11
    container_name: flyway-migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://db:5432/food_delivery
      -user=fd_user
      -password=secret123
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql


  app:
    image: eclipse-temurin:21
    container_name: spring-app
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/food_delivery
      SPRING_DATASOURCE_USERNAME: fd_user
      SPRING_DATASOURCE_PASSWORD: secret123

volumes:
  postgres_data: