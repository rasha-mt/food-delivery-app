spring.application.name=food-delivery-app

#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.url=jdbc:tc:postgresql:15:///testdb

#spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ? show real error
#logging.level.root=DEBUG
#logging.level.org.springframework=DEBUG
#logging.level.com.mentorship=DEBUG

# ? show full error details
#server.error.include-message=always
#server.error.include-stacktrace=always

# ? disable flyway in tests
spring.flyway.enabled=false

# ? let hibernate create tables instead
spring.jpa.hibernate.ddl-auto=create-drop

# reduce hibernate debug logs
logging.level.org.hibernate.orm.sql.ast.tree=WARN
logging.level.org.hibernate.orm.sql.ast.create=WARN
logging.level.org.hibernate.orm.results.graph=WARN
logging.level.org.hibernate.orm.jdbc.mutation=WARN

# keep only useful SQL
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate=WARN

logging:
level:
org.springframework.web: DEBUG
org.hibernate: ERROR

